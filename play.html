<style>
*, *::before, *::after {
  box-sizing: border-box; margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
  cursor: none !important;
}
:root {
  --blue:  #1a52d4;
  --ink:   #1a2744;
  --white: #ffffff;
  --font-display: 'Noto Serif JP', serif;
  --font-mono:    'Space Mono', monospace;
  --font-hand:    'Caveat', cursive;
}
html, body { height: 100%; overflow: hidden; background: var(--blue); }
body {
  display: flex;
  flex-direction: column;
  font-family: var(--font-mono);
}

/* ── CURSOR ── */
.cur-dot {
  position: fixed; width: 7px; height: 7px;
  border-radius: 50%; background: #fff;
  box-shadow: 0 0 0 1.5px rgba(26,82,212,0.3);
  pointer-events: none; z-index: 9999;
  transform: translate(-50%,-50%);
  top: -100px; left: -100px;
}
.cur-ring {
  position: fixed; width: 26px; height: 26px;
  border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.55);
  background: transparent; pointer-events: none; z-index: 9998;
  transform: translate(-50%,-50%);
  top: -100px; left: -100px;
  opacity: 0;
  transition: opacity 0.2s, width 0.25s cubic-bezier(0.34,1.56,0.64,1),
              height 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
.cur-ring.show { opacity: 1; width: 32px; height: 32px; }

/* ── PAGE BODY ── */
.page-body {
  flex: 1; min-height: 0;
  display: grid;
  grid-template-columns: 200px 1fr;
  overflow: hidden;
}

/* ── LEFT COLUMN — sticky ── */
.left-col {
  position: sticky;
  top: 64px; /* nav height */
  height: calc(100vh - 64px);
  padding: 36px 20px 28px 44px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid rgba(255,255,255,0.08);
  overflow: hidden;
}
.left-avatar {
  width: 64px; height: 64px;
  object-fit: contain;
  display: block;
  margin-bottom: 14px;
  transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
}
.left-avatar:hover { transform: translateY(-3px) scale(1.05); }
.avatar-link { display: inline-block; text-decoration: none; }
.left-name {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 300;
  color: #fff;
  line-height: 1.05;
  letter-spacing: -0.01em;
  margin-bottom: 18px;
}
.left-caption {
  font-size: 11px;
  color: rgba(255,255,255,0.65);
  line-height: 1.7;
  margin-bottom: 16px;
}
.left-facts {
  font-size: 11px;
  color: rgba(255,255,255,0.5);
  line-height: 1.95;
}
.left-facts span { display: block; }
.left-facts__link {
  color: #fff;
  text-decoration: underline;
  text-decoration-color: rgba(255,255,255,0.35);
  text-underline-offset: 3px;
  transition: text-decoration-color 0.2s;
}
.left-facts__link:hover {
  text-decoration-color: rgba(255,255,255,0.8);
}
.left-contact {
  margin-top: auto;
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.15);
  font-size: 10px;
  color: rgba(255,255,255,0.38);
  line-height: 1.9;
}
.left-contact a {
  color: rgba(255,255,255,0.38);
  text-decoration: none;
  transition: color 0.2s;
}
.left-contact a:hover { color: rgba(255,255,255,0.8); }

/* ── RIGHT: coming soon ── */
.right-scroll {
  height: 100%; overflow-y: auto; overflow-x: hidden;
  display: flex; flex-direction: column;
}
.right-scroll::-webkit-scrollbar { width: 3px; }
.right-scroll::-webkit-scrollbar-track { background: transparent; }
.right-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

.coming-soon {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 44px;
  text-align: center;
  gap: 28px;
}

/* manga panel style box */
.cs-panel {
  background: #fff;
  border-radius: 6px;
  border: 1.5px solid rgba(255,255,255,0.1);
  width: 100%;
  max-width: 560px;
  padding: 48px 44px;
  position: relative;
  overflow: hidden;
}

/* image variant: no text padding, let the illustration fill the frame */
.cs-panel--image {
  padding: 0;
  line-height: 0;
}
.cs-illustration-wrap {
  position: relative;
  display: block;
}
.cs-illustration {
  display: block;
  width: 100%;
  height: auto;
}
.sweat-drop {
  position: absolute;
  left: 25%;
  top: 35%;
  width: 2.5%;
  min-width: 8px;
  max-width: 10px;
  transform: translateY(5px);
  transition: transform 0.45s cubic-bezier(0.34, 1.15, 0.64, 1);
}
.sweat-drop svg {
  display: block;
  width: 100%;
  height: auto;
  filter: drop-shadow(0 1px 1px rgba(26, 82, 212, 0.2));
}
.sweat-drop:hover {
  transform: translateY(10px);
}
.sweat-drop.intro-slide {
  transform: translateY(10px);
}

/* panel number top left */
.cs-panel-num {
  position: absolute;
  top: 14px; left: 16px;
  font-size: 8px; letter-spacing: 0.12em;
  color: rgba(26,82,212,0.25);
  font-family: var(--font-mono);
  border: 1px solid rgba(26,82,212,0.15);
  padding: 2px 7px;
}

/* caption box inside panel */
.cs-caption {
  position: absolute;
  bottom: 14px; left: 16px;
  border: 1.5px solid var(--blue);
  padding: 7px 12px;
  font-size: 10px;
  color: var(--blue);
  font-family: var(--font-mono);
  background: #fff;
  letter-spacing: 0.06em;
}
.cs-caption__cursor {
  animation: blink 0.8s step-end infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* main content */
.cs-stop {
  font-size: 9px; letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(26,82,212,0.35);
  margin-bottom: 14px;
  font-family: var(--font-mono);
}
.cs-title {
  font-family: var(--font-display);
  font-size: 48px; font-weight: 300;
  color: var(--ink); line-height: 1;
  letter-spacing: -0.01em;
  margin-bottom: 20px;
}
.cs-desc {
  font-size: 12px; color: rgba(26,82,212,0.55);
  line-height: 1.85; max-width: 380px;
  margin: 0 auto 28px;
  font-family: var(--font-mono);
}

/* things coming tag list */
.cs-tags {
  display: flex; flex-wrap: wrap;
  gap: 8px; justify-content: center;
  margin-bottom: 8px;
}
.cs-tag {
  font-size: 8px; letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(26,82,212,0.5);
  border: 1px solid rgba(26,82,212,0.2);
  padding: 4px 10px;
  font-family: var(--font-mono);
}

/* hand-drawn asterisk doodles */
.cs-doodle {
  position: absolute;
  font-family: var(--font-hand);
  font-size: 13px;
  color: rgba(26,82,212,0.18);
  pointer-events: none;
}

/* back link */
.cs-illustration-caption {
  position: absolute;
  bottom: 45px;
  left: 50%;
  transform: translateX(-50%);
  width: fit-content;
  max-width: calc(100% - 28px);
  border: 1.5px solid var(--blue);
  padding: 8px 14px;
  font-size: 13px;
  color: var(--blue);
  font-family: var(--font-mono);
  background: #fff;
  line-height: 1.5;
  text-align: center;
  white-space: nowrap;
  z-index: 2;
}
.cs-back {
  font-size: 10px; letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
  text-decoration: none;
  font-family: var(--font-mono);
  transition: color 0.2s;
}
.cs-back:hover { color: #fff; }
</style>

<script>
  // cursor
  const dot  = document.getElementById('cur-dot');
  const ring = document.getElementById('cur-ring');
  let mx=-100,my=-100,rx=-100,ry=-100;
  document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
  document.querySelectorAll('a, .cs-tag')
    .forEach(el => {
      el.addEventListener('mouseenter', () => ring.classList.add('show'));
      el.addEventListener('mouseleave', () => ring.classList.remove('show'));
    });
  (function loop() {
    dot.style.left=mx+'px'; dot.style.top=my+'px';
    rx+=(mx-rx)*0.12; ry+=(my-ry)*0.12;
    ring.style.left=rx+'px'; ring.style.top=ry+'px';
    requestAnimationFrame(loop);
  })();
</script>

<script>
  (function () {
    const drop = document.querySelector('.sweat-drop');
    if (!drop) return;
    setTimeout(() => drop.classList.add('intro-slide'), 400);
    setTimeout(() => drop.classList.remove('intro-slide'), 1300);
  })();
</script>
<script>
  (function () {
    const STOP_WIDTHS = (function () {
      const track = document.querySelector('.train-nav__track');
      const stops = document.querySelectorAll('.train-nav__stops > .train-nav__stop');
      if (!track || !stops.length) return ['0%', '33.3333%', '66.6667%', '100%'];
      const trackRect = track.getBoundingClientRect();
      return Array.from(stops).map((stop) => {
        const dot = stop.querySelector('.train-nav__dot');
        if (!dot) return '0%';
        const dotRect = dot.getBoundingClientRect();
        const fraction = ((dotRect.left + dotRect.width / 2) - trackRect.left) / trackRect.width;
        return (fraction * 100) + '%';
      });
    })();
    const fill = document.querySelector('.train-nav__fill');
    if (!fill) return;
    const stored = sessionStorage.getItem('navStopIndex');
    if (stored !== null && STOP_WIDTHS[stored] !== undefined) {
      fill.style.transition = 'none';
      fill.style.width = STOP_WIDTHS[stored];
      void fill.offsetWidth;
      fill.style.transition = '';
    }
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        fill.style.width = STOP_WIDTHS[3];
        sessionStorage.setItem('navStopIndex', 3);
      });
    });
  })();
</script>
